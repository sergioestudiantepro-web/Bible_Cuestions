<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe3c8">
<title>Bible Questions</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></symbol>
<symbol id="i-shop" viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0zM5 12v8h14v-8M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
<symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#d9a441"/><circle cx="12" cy="12" r="7" fill="none" stroke="#fff1c4" stroke-width="1.6"/><path d="M12 8.5v7" stroke="#fff1c4" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7.3L12 17.8 5.8 21.5l1.6-7.3L2 9.5l7.1-.6z" fill="currentColor"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4 10-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="7" r="2.4" fill="currentColor"/><circle cx="15" cy="12" r="2.4" fill="currentColor"/><circle cx="8" cy="17" r="2.4" fill="currentColor"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2" fill="currentColor"/><path d="M4 21c0-5 4-7.5 8-7.5s8 2.5 8 7.5z" fill="currentColor"/></symbol>
<symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-6 1 2 1 3 2 3 0-3 0-6 1-9z" fill="currentColor"/></symbol>
<symbol id="i-gift" viewBox="0 0 24 24"><path d="M4 11h16v9H4zM3 7h18v4H3zM12 7v13M12 7C9 2 5 5 8 7M12 7c3-5 7-2 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
<symbol id="i-cross" viewBox="0 0 24 24"><path d="M10 2h4v7h7v4h-7v9h-4v-9H3V9h7z" fill="currentColor"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M3 5h8a2 2 0 0 1 1 1 2 2 0 0 1 1-1h8v14h-8a2 2 0 0 0-1 1 2 2 0 0 0-1-1H3z" fill="currentColor"/><path d="M12 6v13" stroke="#fbf5e5" stroke-width="1.6"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z" fill="currentColor"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z" fill="currentColor"/></symbol>
<symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 18h18l1-11-5 4-5-7-5 7-5-4z" fill="currentColor"/></symbol>
<symbol id="i-half" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
<symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 5l7 7-7 7M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.5l8 3v6.2c0 5-3.6 8.3-8 9.8-4.4-1.5-8-4.8-8-9.8V5.5z" fill="currentColor"/><path d="M8.5 12l2.4 2.4 4.6-4.8" fill="none" stroke="#fbf5e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-ask" viewBox="0 0 24 24"><path d="M8 8.6a4.2 4.2 0 1 1 6.4 3.6c-1.6 1-2.4 1.8-2.4 3.4" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="20" r="1.8" fill="currentColor"/></symbol>
<symbol id="i-word" viewBox="0 0 24 24"><path d="M4.5 20L12 4l7.5 16M7.6 14.4h8.8" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="15" r="1.9" fill="currentColor"/></symbol>
</defs></svg>
<div class="sky"></div>
<main id="app">

<section id="welcome" class="screen active">
  <div class="top">
    <button class="me" data-go="profile"><span class="myAv"></span><span class="meTxt"><b id="chipName"></b><small id="chipLv"></small><i class="xp"><u id="chipXp"></u></i></span></button>
    <span class="pill"><svg class="ic"><use href="#i-coin"/></svg><b class="gN">0</b></span>
  </div>
  <h1>Bible Questions</h1>
  <p class="sub">Conoce la Palabra, libro por libro</p>
  <div class="stage">
  <svg class="jesus" viewBox="0 0 240 300" role="img" aria-label="Jesús dando la bienvenida">
    <defs><radialGradient id="hl"><stop offset="0" stop-color="#f3cf7a" stop-opacity=".6"/><stop offset="1" stop-color="#f3cf7a" stop-opacity="0"/></radialGradient></defs>
    <circle cx="120" cy="104" r="100" fill="url(#hl)"/>
    <circle cx="120" cy="100" r="60" fill="none" stroke="#d9a441" stroke-width="4"/>
    <path d="M76 100Q70 42 120 38Q170 42 164 100L174 170Q120 188 66 170Z" fill="#6b4a2f"/>
    <path d="M52 300L60 178Q120 150 180 178L188 300Z" fill="#fffaf0" stroke="#cdb98f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M62 184Q30 202 14 234L38 248Q56 224 78 210Z" fill="#fffaf0" stroke="#cdb98f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M178 184Q210 202 226 234L202 248Q184 224 162 210Z" fill="#fffaf0" stroke="#cdb98f" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="22" cy="246" r="11" fill="#e9bf93"/><circle cx="218" cy="246" r="11" fill="#e9bf93"/>
    <path d="M56 246Q120 262 184 246L184 262Q120 278 56 262Z" fill="#a5483a"/>
    <path d="M96 170L120 206L144 170Q120 160 96 170Z" fill="#a5483a"/>
    <path d="M100 210L96 296M140 210L144 296" stroke="#e3d5b3" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="106" y="136" width="28" height="36" fill="#d9ad80"/>
    <ellipse cx="120" cy="100" rx="34" ry="42" fill="#e9bf93"/>
    <path d="M86 94Q90 58 120 56Q150 58 154 94Q140 72 120 72Q100 72 86 94Z" fill="#6b4a2f"/>
    <path d="M86 114Q120 104 154 114Q156 152 120 164Q84 152 86 114Z" fill="#6b4a2f"/>
    <circle cx="98" cy="112" r="6" fill="#e59a7a" opacity=".3"/><circle cx="142" cy="112" r="6" fill="#e59a7a" opacity=".3"/>
    <path d="M102 120Q120 111 138 120" stroke="#55381f" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M108 129Q120 138 132 129" stroke="#f6dcc6" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M120 98L117 110Q120 113 123 110" stroke="#c99a70" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="106" cy="96" rx="3.4" ry="4.2" fill="#3a2414"/><ellipse cx="134" cy="96" rx="3.4" ry="4.2" fill="#3a2414"/>
    <path d="M97 86Q106 81 115 86M125 86Q134 81 143 86" stroke="#55381f" stroke-width="3" stroke-linecap="round" fill="none"/>
  </svg></div>
  <div class="bubble"><p id="verse"></p><small id="verseRef"></small></div>
  <button class="btn gold" data-go="levels"><svg class="ic"><use href="#i-play"/></svg> Jugar</button>
  <button class="btn ghost reto" data-go="retos"><svg class="ic"><use href="#i-cal"/></svg> Retos diarios <span class="tag" id="rdTag"></span></button>
  <div class="trio"><button class="btn ghost" data-go="profile"><svg class="ic"><use href="#i-user"/></svg> Perfil</button><button class="btn ghost openSet"><svg class="ic"><use href="#i-set"/></svg> Opciones</button></div>
</section>

<section id="levels" class="screen">
  <header><button class="back" data-go="welcome" aria-label="Volver"><svg class="ic"><use href="#i-back"/></svg></button><h2>Mapa</h2>
  <span class="hr"><span class="pill"><svg class="ic"><use href="#i-coin"/></svg><b class="gN">0</b></span><button class="back" data-go="shop" aria-label="Tienda"><svg class="ic"><use href="#i-shop"/></svg></button></span></header>
  <div class="tabs"><button class="tab">Antiguo Testamento</button><button class="tab">Nuevo Testamento</button></div>
  <p id="prog" class="prog"></p>
  <div id="map" class="map"></div>
</section>

<section id="game" class="screen">
  <header><button class="back" id="btnQuit" aria-label="Salir del nivel"><svg class="ic"><use href="#i-back"/></svg></button><h2 id="lvlName"></h2><span id="qCount"></span></header>
  <div class="timer"><div id="bar"></div><b id="secs">15</b></div>
  <p id="question"></p>
  <div id="options"></div>
  <div class="pws">
    <button class="pw" data-k="f"><svg class="ic"><use href="#i-half"/></svg>50:50<em></em></button>
    <button class="pw" data-k="t"><svg class="ic"><use href="#i-clock"/></svg>Tiempo<em></em></button>
    <button class="pw" data-k="s"><svg class="ic"><use href="#i-skip"/></svg>Saltar<em></em></button>
    <button class="pw" data-k="e"><svg class="ic"><use href="#i-shield"/></svg>Escudo<em></em></button>
  </div>
  <div id="feedback" class="hidden"></div>
</section>

<section id="result" class="screen">
  <h2 id="resTitle"></h2><div id="resStars"></div><p id="resText"></p>
  <button class="btn gold" id="btnAgain">Repetir</button>
  <button class="btn ghost" data-go="levels">Volver al mapa</button>
  <button class="btn ghost" data-go="welcome">Inicio</button>
</section>

<section id="profile" class="screen">
  <header><button class="back" data-go="welcome" aria-label="Volver"><svg class="ic"><use href="#i-back"/></svg></button><h2>Mi perfil</h2><span class="pill"><svg class="ic"><use href="#i-coin"/></svg><b class="gN">0</b></span></header>
  <div class="myAv big"></div>
  <input id="pName" maxlength="14" aria-label="Tu nombre">
  <p id="pLv" class="lv"></p><i class="xp wide"><u id="pXp"></u></i><small id="pXpTxt"></small>
  <div class="stats" id="pStats"></div>
  <button class="btn gold" data-go="shop"><svg class="ic"><use href="#i-shop"/></svg> Tienda</button>
</section>

<section id="shop" class="screen">
  <header><button class="back" data-go="levels" aria-label="Volver"><svg class="ic"><use href="#i-back"/></svg></button><h2>Tienda</h2><span class="pill"><svg class="ic"><use href="#i-coin"/></svg><b class="gN">0</b></span></header>
  <div id="shopList"></div>
</section>

<section id="retos" class="screen">
  <header><button class="back" data-go="welcome" aria-label="Volver"><svg class="ic"><use href="#i-back"/></svg></button><h2>Retos diarios</h2><span class="pill"><svg class="ic"><use href="#i-coin"/></svg><b class="gN">0</b></span></header>
  <div id="rdBody" class="rdBody"></div>
</section>

<section id="word" class="screen">
  <header><button class="back" id="btnWQuit" aria-label="Salir del reto"><svg class="ic"><use href="#i-back"/></svg></button><h2>Palabra bíblica</h2><span id="wCount"></span></header>
  <p id="wClue" class="clue"></p>
  <p id="wMsg" class="wMsg" aria-live="polite"></p>
  <div id="wGrid" class="wgrid"></div>
  <div id="wBank" class="bank"></div>
  <div class="trio wact">
    <button class="btn ghost" id="btnWBack">Borrar</button>
    <button class="btn ghost" id="btnWMix">Mezclar</button>
    <button class="btn gold" id="btnWCheck">Comprobar</button>
  </div>
  <div class="pws three">
    <button class="rp" data-k="f"><svg class="ic"><use href="#i-half"/></svg>Pista<em></em></button>
    <button class="rp" data-k="t"><svg class="ic"><use href="#i-clock"/></svg>+Intento<em></em></button>
    <button class="rp" data-k="s"><svg class="ic"><use href="#i-skip"/></svg>Saltar<em></em></button>
  </div>
  <div id="wFeedback" class="hidden"></div>
</section>

<section id="dres" class="screen">
  <div id="drIcon"></div><h2 id="drTitle"></h2><div id="drRow" class="drRow"></div><p id="drText"></p>
  <button class="btn gold" data-go="retos">Volver a retos</button>
  <button class="btn ghost" data-go="welcome">Inicio</button>
</section>

<div id="settings" class="modal hidden"><div class="card">
  <h2>Opciones</h2>
  <label class="row">Música de fondo <input type="checkbox" id="chkMusic"></label>
  <label class="row">Vibración <input type="checkbox" id="chkVib" checked></label>
  <button class="btn ghost" id="btnReset">Borrar progreso</button>
  <button class="btn gold" id="btnClose">Cerrar</button>
</div></div>

<div id="daily" class="modal hidden"><div class="card">
  <svg class="ic huge"><use href="#i-gift"/></svg><h2>Recompensa diaria</h2><p id="dText"></p><button class="btn gold" id="btnDaily">Recibir</button>
</div></div>

<div id="unlock" class="modal hidden"><div class="card">
  <div class="lockWrap"><i></i><i></i>
  <svg class="lockA" viewBox="0 0 64 64"><path class="sh" d="M20 30V22a12 12 0 0 1 24 0v8" fill="none" stroke="#b8842f" stroke-width="6" stroke-linecap="round"/><rect x="12" y="30" width="40" height="28" rx="6" fill="#d9a441"/><circle cx="32" cy="43" r="4" fill="#7a5418"/></svg></div>
  <h2>Libro superado</h2><p id="uText"></p><button class="btn gold" id="btnUnlock">Continuar</button>
</div></div>
</main>
<script src="script.js"></script>
</body>
</html>
